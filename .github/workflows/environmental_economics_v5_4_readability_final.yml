name: Environmental Economics Iqbal v5.4 Readability Final
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/environmental_economics_v5_4_readability_final.yml"

jobs:
  render:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - slug: A1
            order: "01"
          - slug: A3
            order: "02"
          - slug: B5
            order: "03"
          - slug: B6
            order: "04"
          - slug: B7
            order: "05"
          - slug: C9
            order: "06"
          - slug: C11
            order: "07"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarMusayev/ai-handwriting-generator
          path: handmagic
          lfs: true
      - working-directory: handmagic
        run: |
          git lfs install
          git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-dejavu-core fonts-liberation
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install --only-binary=:all: "numpy>=1.26,<3" "pillow>=10" "matplotlib>=3.8,<4" "reportlab>=4"
          python -m pip install "pytesseract>=0.3.13"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m py_compile environmental_economics_handmagic_v5_4.py
      - name: Render ${{ matrix.slug }}
        run: |
          python environmental_economics_handmagic_v5_4.py \
            answers/environmental_economics_20261003_${{ matrix.slug }}.txt \
            environmental_v54_readable_${{ matrix.order }}_${{ matrix.slug }} \
            Environmental_Economics_${{ matrix.order }}_${{ matrix.slug }}_Iqbal_V5_4.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: env-v54-readable-${{ matrix.order }}-${{ matrix.slug }}
          path: environmental_v54_readable_${{ matrix.order }}_${{ matrix.slug }}/Environmental_Economics_${{ matrix.order }}_${{ matrix.slug }}_Iqbal_V5_4.pdf
          retention-days: 7

  merge:
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: env-v54-readable-*
          path: pieces
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pypdf>=5"
      - name: Merge final v5.4
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter
          order=["01_A1","02_A3","03_B5","04_B6","05_B7","06_C9","07_C11"]
          files=list(Path("pieces").rglob("*.pdf"))
          w=PdfWriter()
          for key in order:
              m=[p for p in files if key in p.name]
              if len(m)!=1:
                  raise SystemExit(f"Expected one PDF for {key}, found {m}")
              for pg in PdfReader(str(m[0])).pages:
                  w.add_page(pg)
          out=Path("Environmental_Economics_Selected_Answers_Iqbal_V5_4_FINAL.pdf")
          with out.open("wb") as f:
              w.write(f)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: environmental-economics-iqbal-v5-4-readable-final
          path: Environmental_Economics_Selected_Answers_Iqbal_V5_4_FINAL.pdf
          retention-days: 7
