name: Hand Magic Transformer Legibility Test

on:
  push:
    branches: [main]
    paths:
      - "transformer_test.py"
      - ".github/workflows/generate.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Hand Magic
        uses: actions/checkout@v4
        with:
          repository: OmarMusayev/ai-handwriting-generator
          path: handmagic
          lfs: true
      - name: Pull model weights
        working-directory: handmagic
        run: |
          git lfs install
          git lfs pull
          ls -lh weights/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Generate comparison
        run: python transformer_test.py
      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: transformer-legibility-test
          path: transformer_test/*.png
