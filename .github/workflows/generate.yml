name: Generate Hand Magic PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout real Hand Magic
        uses: actions/checkout@v4
        with:
          repository: OmarMusayev/ai-handwriting-generator
          path: handmagic
          lfs: true

      - name: Pull Hand Magic model weights
        working-directory: handmagic
        run: |
          git lfs install
          git lfs pull
          ls -lh weights/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow matplotlib reportlab
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate with real Hand Magic LSTM
        run: python generate_handmagic_lstm_pdf.py

      - name: Commit generated PDF and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Generate Hand Magic handwriting PDF"
            git push
          fi
