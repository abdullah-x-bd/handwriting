name: Hand Magic LSTM Legibility Test
on:
  push:
    branches: [main]
    paths:
      - "lstm_test.py"
      - ".github/workflows/lstm_test.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarMusayev/ai-handwriting-generator
          path: handmagic
          lfs: true
      - working-directory: handmagic
        run: |
          git lfs install
          git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pillow matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python lstm_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: lstm-legibility-test
          path: lstm_test/*.png
