name: Hand Magic Chunked A1 Sample
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chunked_sample.yml"
  workflow_dispatch:
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarMusayev/ai-handwriting-generator
          path: handmagic
          lfs: true
      - working-directory: handmagic
        run: |
          git lfs install
          git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install --only-binary=:all: "numpy>=1.26,<3" "pillow>=10" "matplotlib>=3.8,<4" "reportlab>=4"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python generate_handmagic_chunked_sample.py
      - uses: actions/upload-artifact@v4
        with:
          name: handmagic-chunked-A1
          path: chunked_sample/
          retention-days: 7
