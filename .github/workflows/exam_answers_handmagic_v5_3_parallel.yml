name: Exam Answers Hand Magic v5.3 Parallel Page OCR
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/exam_answers_handmagic_v5_3_parallel.yml"
  workflow_dispatch:

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - idx: 0
            part: A1
          - idx: 1
            part: A2
          - idx: 2
            part: A3
          - idx: 3
            part: A4
          - idx: 4
            part: B5
          - idx: 5
            part: B6
          - idx: 6
            part: B7
          - idx: 7
            part: B8
          - idx: 8
            part: C9
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarMusayev/ai-handwriting-generator
          path: handmagic
          lfs: true
      - working-directory: handmagic
        run: |
          git lfs install
          git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select answer block
        env:
          PART_INDEX: ${{ matrix.idx }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p=Path("answers/exam_answers_20260930.txt")
          text=p.read_text(encoding="utf-8")
          blocks=[b.strip() for b in re.split(r"\n\s*---\s*\n",text) if b.strip()]
          idx=int(os.environ["PART_INDEX"])
          if len(blocks) != 9:
              raise SystemExit(f"Expected 9 answer blocks, got {len(blocks)}")
          p.write_text(blocks[idx]+"\n",encoding="utf-8")
          print("Selected",idx,blocks[idx].splitlines()[0])
          PY
      - name: Install OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install --only-binary=:all: "numpy>=1.26,<3" "pillow>=10" "matplotlib>=3.8,<4" "reportlab>=4"
          python -m pip install "pytesseract>=0.3.13"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate renderer
        run: python -m py_compile exam_answers_handmagic_v5_3.py
      - name: Render answer
        run: python exam_answers_handmagic_v5_3.py
      - uses: actions/upload-artifact@v4
        with:
          name: exam-handmagic-v5-3-${{ matrix.part }}
          path: exam_answers_handmagic_v5_3_output/
          retention-days: 7
